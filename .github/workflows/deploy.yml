name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check CLI
        run: npx tsc --noEmit

      # Same ordering as ci.yml, and for the same reason: `bin/cli.mjs` loads from
      # `dist/`, and four test files drive the CLI as a subprocess. Without a build
      # they skip, so this gate was running 17 fewer tests than it appeared to.
      - name: Build CLI
        run: npm run cli:build

      - name: Run tests
        run: npm test

      - name: Build website
        run: npm run website:build

      # The convoy viewer in its static mode, over a committed snapshot of
      # recorded runs. Regenerate it with tools/viewer-demo/export.mjs.
      - name: Add the convoy viewer demo
        run: |
          test -f tools/viewer-demo/snapshot/index.html
          mkdir -p website/dist/dashboard
          cp -R tools/viewer-demo/snapshot/. website/dist/dashboard/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
