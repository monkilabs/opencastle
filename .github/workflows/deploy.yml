name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate demo convoy DB for dashboard
        run: npm run dashboard:generate-demo-db

      - name: Run dashboard ETL to produce demo JSON
        run: npm run dashboard:etl

      - name: Type-check CLI
        run: npx tsc --noEmit

      # Same ordering as ci.yml, and for the same reason: `bin/cli.mjs` loads from
      # `dist/`, and four test files drive the CLI as a subprocess. Without a build
      # they skip, so this gate was running 17 fewer tests than it appeared to.
      - name: Build CLI
        run: npm run cli:build

      - name: Run tests
        run: npm test

      - name: Build website
        run: npm run website:build

      - name: Build dashboard
        run: npm run dashboard:build
        env:
          DASHBOARD_BASE: /dashboard/

      - name: Copy ETL data into dashboard build output
        run: mkdir -p src/dashboard/dist/data && cp -r src/dashboard/public/data/* src/dashboard/dist/data/ || true

      - name: Merge dashboard into website output
        run: mkdir -p website/dist/dashboard && cp -r src/dashboard/dist/* website/dist/dashboard/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
