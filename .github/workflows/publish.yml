name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip version-bump commits to prevent infinite loops
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Determine version bump
        id: bump
        run: |
          # Find commits since last version tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --format="%s")
          else
            COMMITS=$(git log "$LAST_TAG"..HEAD --oneline --format="%s")
          fi

          if [ -z "$COMMITS" ]; then
            echo "type=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Commits since $LAST_TAG:"
          echo "$COMMITS"

          # Check for breaking changes
          if echo "$COMMITS" | grep -qiE 'BREAKING CHANGE|^[a-z]+!:'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      # Before anything expensive, and before the error can be mistaken for
      # something else.
      #
      # npm answers a publish it will not authorize with
      # `E404 … PUT /opencastle — Not found`: it hides the difference between
      # "no such package" and "not your package", so the log names the wrong
      # problem. Five releases in a row failed that way — each after a full
      # install, type-check, test run and build — reading as though the package
      # had never existed, while `opencastle` sat on the registry the whole time.
      #
      # `npm whoami` asks the same credential the same registry, and answers in
      # one second.
      - name: Check npm credentials
        if: steps.bump.outputs.type != 'none'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

          if ! WHOAMI=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN is set, and the registry rejected it: ${WHOAMI}"
            echo "::error::Publishing needs a token with read-write access to $(node -p "require('./package.json').name")."
            echo "::error::Rotate it at npmjs.com → Access Tokens (Automation, or Granular read-write on this package) and update the NPM_TOKEN secret."
            echo "::error::Trusted publishing is the alternative: configure this repo and workflow as a trusted publisher on npmjs.com, and no stored token expires."
            exit 1
          fi
          echo "Authenticated to npm as ${WHOAMI}"

      - name: Bump version
        if: steps.bump.outputs.type != 'none'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_VERSION=$(npm version ${{ steps.bump.outputs.type }} --no-git-tag-version)
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION (${{ steps.bump.outputs.type }})"

      - name: Install dependencies
        if: steps.bump.outputs.type != 'none'
        run: npm ci

      - name: Type-check CLI
        if: steps.bump.outputs.type != 'none'
        run: npx tsc --noEmit

      - name: Run tests
        if: steps.bump.outputs.type != 'none'
        run: npm test

      - name: Build
        if: steps.bump.outputs.type != 'none'
        # Deliberately does not generate demo data. The demo generator writes
        # through the convoy store, so a schema change there used to break the
        # npm release. The published dashboard ships empty and fills from the
        # user's own runs.
        run: npm run build

      - name: Publish
        if: steps.bump.outputs.type != 'none'
        id: publish
        run: |
          # Check if this version already exists on npm (idempotent re-runs)
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "⏭️ ${PKG_NAME}@${PKG_VERSION} already published — skipping"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          elif npm publish --ignore-scripts --access public; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            # The credential passed `npm whoami` and still could not publish, so
            # the account is authenticated but not authorized for this package —
            # a granular token scoped elsewhere, or an account that is not a
            # maintainer. npm reports both as a 404 on the PUT.
            echo "::error::npm rejected the publish of ${PKG_NAME}@${PKG_VERSION}."
            echo "::error::A 404 on PUT for a package that exists means the token is not authorized to write to it, not that the package is missing."
            echo "::error::Check that the NPM_TOKEN account maintains ${PKG_NAME}, and that a granular token lists it with read-write."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump & tag
        if: steps.bump.outputs.type != 'none'
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release ${{ steps.version.outputs.new }}"
          git tag "${{ steps.version.outputs.new }}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        if: steps.bump.outputs.type != 'none'
        run: |
          # Check if release already exists (idempotent re-runs)
          if gh release view "${{ steps.version.outputs.new }}" &>/dev/null; then
            echo "⏭️ Release ${{ steps.version.outputs.new }} already exists — skipping"
          else
            # Brief delay to ensure the tag is available on the remote
            sleep 5
            gh release create "${{ steps.version.outputs.new }}" \
              --title "${{ steps.version.outputs.new }}" \
              --generate-notes \
              --target main
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.bump.outputs.type }}" != "none" ]; then
            echo "📦 Published opencastle@${{ steps.version.outputs.new }} (${{ steps.bump.outputs.type }} bump)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ No new commits since last release — skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
