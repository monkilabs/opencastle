name: Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # No loop to guard against: this workflow pushes a tag and nothing else, so
    # it never produces the commit on main that used to re-trigger it.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Determine version bump
        id: bump
        run: |
          # Find commits since last version tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --format="%s")
          else
            COMMITS=$(git log "$LAST_TAG"..HEAD --oneline --format="%s")
          fi

          if [ -z "$COMMITS" ]; then
            echo "type=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Commits since $LAST_TAG:"
          echo "$COMMITS"

          # Check for breaking changes
          if echo "$COMMITS" | grep -qiE 'BREAKING CHANGE|^[a-z]+!:'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      # Before anything expensive, and before the error can be mistaken for
      # something else.
      #
      # npm answers a publish it will not authorize with
      # `E404 … PUT /opencastle — Not found`: it hides the difference between
      # "no such package" and "not your package", so the log names the wrong
      # problem. Five releases in a row failed that way — each after a full
      # install, type-check, test run and build — reading as though the package
      # had never existed, while `opencastle` sat on the registry the whole time.
      #
      # `npm whoami` asks the same credential the same registry, and answers in
      # one second.
      - name: Check npm credentials
        if: steps.bump.outputs.type != 'none'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

          if ! WHOAMI=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN is set, and the registry rejected it: ${WHOAMI}"
            echo "::error::Publishing needs a token with read-write access to $(node -p "require('./package.json').name")."
            echo "::error::Rotate it at npmjs.com → Access Tokens (Automation, or Granular read-write on this package) and update the NPM_TOKEN secret."
            echo "::error::Trusted publishing is the alternative: configure this repo and workflow as a trusted publisher on npmjs.com, and no stored token expires."
            exit 1
          fi
          echo "Authenticated to npm as ${WHOAMI}"

      # The released version is derived, not stored.
      #
      # `main` is protected by a ruleset with an empty bypass list — every change
      # goes through a pull request — so this workflow cannot commit a bump, and
      # the tag is the only durable record it can write. package.json on main is
      # therefore a floor rather than the truth: the higher of it and the last
      # tag is what the next version is computed from, so a hand-written bump in
      # a PR is still honoured, and a release can never go backwards into a
      # version npm would then serve as `latest`.
      - name: Determine next version
        if: steps.bump.outputs.type != 'none'
        id: version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          TAG=${TAG#v}
          BASE=$(node -e '
            const [a, b] = process.argv.slice(1).filter(Boolean)
            if (!b) { console.log(a); process.exit(0) }
            const part = (s) => s.split(".").map(Number)
            const [x, y] = [part(a), part(b)]
            for (let i = 0; i < 3; i++) {
              if ((x[i] || 0) !== (y[i] || 0)) { console.log((x[i] || 0) > (y[i] || 0) ? a : b); process.exit(0) }
            }
            console.log(a)
          ' "$PKG" "$TAG")
          echo "package.json=$PKG, last tag=${TAG:-none}, base=$BASE"

          # In the runner only — nothing commits this file.
          npm version "$BASE" --no-git-tag-version --allow-same-version >/dev/null
          NEW_VERSION=$(npm version ${{ steps.bump.outputs.type }} --no-git-tag-version)
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $NEW_VERSION (${{ steps.bump.outputs.type }})"

      - name: Install dependencies
        if: steps.bump.outputs.type != 'none'
        run: npm ci

      - name: Type-check CLI
        if: steps.bump.outputs.type != 'none'
        run: npx tsc --noEmit

      - name: Run tests
        if: steps.bump.outputs.type != 'none'
        run: npm test

      - name: Build
        if: steps.bump.outputs.type != 'none'
        # Deliberately does not generate demo data. The demo generator writes
        # through the convoy store, so a schema change there used to break the
        # npm release. The published dashboard ships empty and fills from the
        # user's own runs.
        run: npm run build

      - name: Publish
        if: steps.bump.outputs.type != 'none'
        id: publish
        run: |
          # Check if this version already exists on npm (idempotent re-runs)
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "⏭️ ${PKG_NAME}@${PKG_VERSION} already published — skipping"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          elif npm publish --ignore-scripts --access public; then
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          else
            # The credential passed `npm whoami` and still could not publish, so
            # the account is authenticated but not authorized for this package —
            # a granular token scoped elsewhere, or an account that is not a
            # maintainer. npm reports both as a 404 on the PUT.
            echo "::error::npm rejected the publish of ${PKG_NAME}@${PKG_VERSION}."
            echo "::error::A 404 on PUT for a package that exists means the token is not authorized to write to it, not that the package is missing."
            echo "::error::Check that the NPM_TOKEN account maintains ${PKG_NAME}, and that a granular token lists it with read-write."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A tag on the commit that was published, and nothing else.
      #
      # This used to commit the bump and `git push origin main --follow-tags`,
      # which the branch ruleset rejects: "Changes must be made through a pull
      # request." The publish had already succeeded by then, so the release
      # reached npm and the repository kept no record of it — no tag, no
      # release, and a version the next run would try to publish again. Tags are
      # not covered by the ruleset, and a tag is all the next run needs.
      - name: Tag the release
        if: steps.bump.outputs.type != 'none'
        run: |
          TAG="${{ steps.version.outputs.new }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "⏭️ ${TAG} already tagged — skipping"
          else
            git tag "${TAG}" "$GITHUB_SHA"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        if: steps.bump.outputs.type != 'none'
        run: |
          # Check if release already exists (idempotent re-runs)
          if gh release view "${{ steps.version.outputs.new }}" &>/dev/null; then
            echo "⏭️ Release ${{ steps.version.outputs.new }} already exists — skipping"
          else
            # Brief delay to ensure the tag is available on the remote
            sleep 5
            gh release create "${{ steps.version.outputs.new }}" \
              --title "${{ steps.version.outputs.new }}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.bump.outputs.type }}" != "none" ]; then
            echo "📦 Published opencastle@${{ steps.version.outputs.new }} (${{ steps.bump.outputs.type }} bump)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ No new commits since last release — skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
