# Fails the build when generated AI assistant config no longer matches its source.
#
# Copy this into your own repository to keep CLAUDE.md, .cursor/rules,
# copilot-instructions.md and the rest from drifting apart. It writes nothing —
# it compiles to a scratch directory and compares.
name: opencastle

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: assistant config in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx opencastle sync --check
