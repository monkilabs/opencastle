name: MCP pins

# Every MCP server OpenCastle writes into a project is pinned to an exact
# version. A pin can still rot: the version can be unpublished, or the package
# pulled — which is how a default once pointed at a name anyone could claim.
# This turns that into a red check here, before a user's server fails to start.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every pinned MCP server exists on the registry
        run: node scripts/mcp-pins.mjs
