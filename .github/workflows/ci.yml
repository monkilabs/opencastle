name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # bin/cli.mjs loads from dist/, so the round trip needs a build first.
      - name: Build CLI
        run: npm run cli:build

      # The claim the README makes: init a project, and `sync --check` on the
      # committed output is clean. Runs the local build, not the published one.
      - name: Compile-and-check round trip
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          git -C "$scratch" init -q
          cd "$scratch"
          printf '# House rules\n\nNEVER_TOUCH_PAYMENTS\n\n```text\nkeep\n\n\n\nthese\n```\n' > CLAUDE.md
          cp CLAUDE.md /tmp/before
          node "$GITHUB_WORKSPACE/bin/cli.mjs" init --yes
          node "$GITHUB_WORKSPACE/bin/cli.mjs" init --yes
          node "$GITHUB_WORKSPACE/bin/cli.mjs" sync --check

          # The generated config must be committed and must survive a clone —
          # the only shape that catches a .gitignore still hiding it.
          git -c user.email=ci@example.com -c user.name=ci add -A
          git -c user.email=ci@example.com -c user.name=ci commit -qm generated
          git clone -q "$scratch" "$scratch-clone"
          cd "$scratch-clone"
          node "$GITHUB_WORKSPACE/bin/cli.mjs" sync --check
          cd "$scratch"

          # And removal returns the user's half byte for byte, not merely with
          # the sentinel still somewhere in it.
          node "$GITHUB_WORKSPACE/bin/cli.mjs" remove --all --yes
          diff /tmp/before CLAUDE.md
